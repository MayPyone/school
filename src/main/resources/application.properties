spring.application.name=school

# 1. Connection (Uses Render's Database URL environment variable)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 3. Flyway Migration
spring.flyway.enabled=true
spring.flyway.clean-disabled=true

# Supabase Storage (Injected via Environment Variables)
app.supabase.storage.project-ref=${SUPABASE_PROJECT_REF}
app.supabase.storage.endpoint=${SUPABASE_ENDPOINT}
app.supabase.storage.access-key-id=${SUPABASE_ACCESS_KEY_ID}
app.supabase.storage.secret-access-key=${SUPABASE_SECRET_ACCESS_KEY}
app.supabase.storage.bucket=${SUPABASE_BUCKET}
app.supabase.storage.public-base-url=${SUPABASE_PUBLIC_BASE_URL}
app.supabase.storage.region=${SUPABASE_REGION}
app.supabase.storage.upload-url-duration-seconds=300